name: Deploy Trip Vault to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Google sharing: write the public IDs from the github-pages environment secrets into the site.
      # The OAuth client secret is deliberately not passed: the browser sign-in flow never uses it.
      - name: Write Google sharing config
        env:
          CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROJECT_NUMBER: ${{ secrets.GOOGLE_PROJECT_NUMBER }}
        run: node .github/scripts/write-sync-config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
